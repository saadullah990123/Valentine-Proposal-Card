<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="nisar.css">
  <title>Funny Scheduler</title>
</head>
<body>
  <div class="popup">
    <img src="calender.jpg" alt="Calendar Icon">
    <h2>So... when are you free?</h2>

    <div class="form-group">
      <label for="day">Pick a Day 🗓️</label>
      <input type="date" id="day" placeholder="dd/mm/yyyy">
    </div>

    <div class="form-group">
      <label for="time">What Time? ⏰</label>
      <select id="time">
        <option>Select a time...</option>
        <option>10:00 AM</option>
        <option>2:00 PM</option>
        <option>6:00 PM</option>
      </select>
    </div>
    <div class="buttons">
    <a href="food.html"><button class="play">Select Date and Time<span>❤️</span></button></a>
    </div>
  </div>
</body>
</html>
